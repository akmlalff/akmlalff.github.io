name: Update Letterboxd movies

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Letterboxd movies
        run: node tools/update-letterboxd-movies.mjs

      - name: Commit updated movies
        run: |
          if git diff --quiet -- movies/movies.json; then
            echo "No movie changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add movies/movies.json
          git commit -m "Update Letterboxd movies"
          git push
