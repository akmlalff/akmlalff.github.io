name: Update Goodreads books

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Goodreads books
        run: node tools/update-goodreads-books.mjs

      - name: Commit updated books
        run: |
          if git diff --quiet -- books/books.json; then
            echo "No book changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/books.json
          git commit -m "Update Goodreads books"
          git push
