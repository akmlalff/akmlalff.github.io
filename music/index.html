    <style>
      .music-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
      }
      .music-table thead th {
        text-align: left;
        padding: 0.85rem 1rem;
        font-size: 0.92rem;
        color: var(--muted);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        border-bottom: 1px solid rgba(128, 128, 128, 0.16);
      }
      .music-table td {
        padding: 0.95rem 1rem;
        border-bottom: 1px solid rgba(128, 128, 128, 0.12);
        vertical-align: top;
      }
      .music-table td.text-right {
        text-align: right;
        white-space: nowrap;
      }
      .music-table tbody tr:last-child td {
        border-bottom: none;
      }
      .music-section {
        margin-top: 1.5rem;
      }
      .top-albums {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 0.75rem;
        align-items: start;
      }
      .top-album {
        text-align: center;
      }
      .top-album img {
        width: 100%;
        height: auto;
        object-fit: contain;
        border-radius: 1rem;
        display: block;
      }
      .scroll-frame {
        max-height: 320px;
        overflow-y: auto;
        padding-right: 0.25rem;
      }
      .scroll-frame table {
        margin-top: 0;
      }
      @media (max-width: 920px) {
        .top-albums {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      @media (max-width: 720px) {
        .music-table thead {
          display: none;
        }
        .music-table, .music-table tbody, .music-table tr, .music-table td {
          display: block;
          width: 100%;
        }
        .music-table tr {
          margin-bottom: 0.85rem;
          border: 1px solid rgba(128, 128, 128, 0.12);
          border-radius: 0.85rem;
          overflow: hidden;
        }
        .music-table td {
          border: none;
          padding: 0.75rem 0.85rem;
        }
        .music-table td::before {
          content: attr(data-label) ": ";
          font-weight: 700;
          display: inline-block;
          width: 5.5rem;
          color: var(--muted);
        }
        .music-table td.text-right {
          text-align: left;
        }
      }
    </style>

    <script>
      // Inspired-by implementation: uses site's layout and styles, lightweight JS
      const API_KEY = 'fa3e98bf38cbee2d094dd74cd56e795e';
      const USERNAME = 'aakamai';

      function el(id) { return document.getElementById(id); }

      async function fetchJson(url) {
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.statusText);
        return res.json();
      }

      const topAlbumFiles = [
        'WhatsApp Image 2026-05-23 at 5.15.31 AM.jpeg',
        'WhatsApp Image 2026-05-23 at 5.15.31 AM (1).jpeg',
        'WhatsApp Image 2026-05-23 at 5.15.31 AM (2).jpeg',
        'WhatsApp Image 2026-05-23 at 5.15.31 AM (3).jpeg',
        'WhatsApp Image 2026-05-23 at 5.15.31 AM (4).jpeg'
      ];
      const topAlbumCovers = topAlbumFiles.map(name => encodeURI(`../top5/${name}`));

      function formatPlays(n){ return n ? `${n} plays` : '' }

      function relativeTime(uts){
        if (!uts) return '';
        const seconds = Math.floor(Date.now()/1000 - parseInt(uts, 10));
        if (seconds < 60) return 'just now';
        if (seconds < 3600) return `${Math.floor(seconds / 60)} minute${Math.floor(seconds / 60) === 1 ? '' : 's'} ago`;
        if (seconds < 86400) return `${Math.floor(seconds / 3600)} hour${Math.floor(seconds / 3600) === 1 ? '' : 's'} ago`;
        if (seconds < 604800) return `${Math.floor(seconds / 86400)} day${Math.floor(seconds / 86400) === 1 ? '' : 's'} ago`;
        return new Date(parseInt(uts, 10) * 1000).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      }

      function buildLastSeenMaps(items){
        const artist = new Map();
        const track = new Map();
        items.forEach(it => {
          const uts = it.date?.uts;
          if (!uts) return;
          const artistKey = escapeHtml(it.artist['#text']);
          const trackKey = `${escapeHtml(it.name)}|${artistKey}`;
          const existingArtist = artist.get(artistKey);
          const existingTrack = track.get(trackKey);
          if (!existingArtist || parseInt(uts, 10) > parseInt(existingArtist, 10)) {
            artist.set(artistKey, uts);
          }
          if (!existingTrack || parseInt(uts, 10) > parseInt(existingTrack, 10)) {
            track.set(trackKey, uts);
          }
        });
        return { artist, track };
      }

      async function loadMusic() {
        try {
          const recent = await fetchJson(`https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${USERNAME}&api_key=${API_KEY}&limit=10&format=json`);
          const topAlbums = await fetchJson(`https://ws.audioscrobbler.com/2.0/?method=user.gettopalbums&user=${USERNAME}&api_key=${API_KEY}&period=1month&limit=5&format=json`);
          const topArtists = await fetchJson(`https://ws.audioscrobbler.com/2.0/?method=user.gettopartists&user=${USERNAME}&api_key=${API_KEY}&period=1month&limit=8&format=json`);
          const topTracks = await fetchJson(`https://ws.audioscrobbler.com/2.0/?method=user.gettoptracks&user=${USERNAME}&api_key=${API_KEY}&period=1month&limit=8&format=json`);

          const recentTracks = recent.recenttracks?.track || [];
          const lastSeen = buildLastSeenMaps(recentTracks);

          renderTopAlbums(topAlbums.topalbums?.album || []);
          renderRecent(recentTracks);
          renderTopArtists(topArtists.topartists?.artist || [], lastSeen.artist);
          renderTopTracks(topTracks.toptracks?.track || [], lastSeen.track);
        } catch (e) {
          console.error('music load failed', e);
          el('recentList').innerHTML = '<tr><td colspan="3" class="muted">Unable to load music.</td></tr>';
        }
      }

      function renderRecent(items){
        const list = el('recentList'); list.innerHTML = '';
        if (!items.length) {
          list.innerHTML = '<tr><td colspan="3" class="muted">No recent tracks.</td></tr>';
          return;
        }
        items.forEach(it => {
          const now = it['@attr']?.nowplaying === 'true';
          const label = now ? 'Now' : (it.date?.uts ? relativeTime(it.date.uts) : '');
          const row = document.createElement('tr');
          row.innerHTML = `
            <td data-label="Track"><strong>${escapeHtml(it.name)}</strong></td>
            <td data-label="Artist">${escapeHtml(it.artist['#text'])}</td>
            <td data-label="Time" class="text-right">${escapeHtml(label)}</td>
          `;
          list.appendChild(row);
          if (now) showNowPlaying(it);
        });
      }

      function renderTopArtists(items, lastSeen){
        const list = el('topArtistsList'); list.innerHTML = '';
        if (!items.length) {
          list.innerHTML = '<tr><td colspan="3" class="muted">No artists.</td></tr>';
          return;
        }
        items.forEach((a)=>{
          const artistName = escapeHtml(a.name);
          const row = document.createElement('tr');
          const seen = lastSeen.get(artistName);
          row.innerHTML = `
            <td data-label="Artist"><strong>${artistName}</strong></td>
            <td data-label="Plays">${formatPlays(a.playcount)}</td>
            <td data-label="Last seen" class="text-right">${seen ? relativeTime(seen) : '—'}</td>
          `;
          list.appendChild(row);
        });
      }

      function renderTopTracks(items, lastSeen){
        const list = el('topTracksList'); list.innerHTML = '';
        if (!items.length) {
          list.innerHTML = '<tr><td colspan="3" class="muted">No tracks.</td></tr>';
          return;
        }
        items.forEach((t)=>{
          const trackName = escapeHtml(t.name);
          const artistName = escapeHtml(t.artist.name);
          const row = document.createElement('tr');
          const seen = lastSeen.get(`${trackName}|${artistName}`);
          row.innerHTML = `
            <td data-label="Track"><strong>${trackName}</strong></td>
            <td data-label="Artist">${artistName}</td>
            <td data-label="Last seen" class="text-right">${seen ? relativeTime(seen) : '—'}</td>
          `;
          list.appendChild(row);
        });
      }

      function showNowPlaying(track){
        const card = el('nowPlayingCard');
        el('nowPlayingTitle').textContent = track.name;
        el('nowPlayingArtist').textContent = track.artist['#text'];
        el('nowPlayingTime').textContent = 'Now playing';
        card.style.display = '';
      }

      function renderTopAlbums(items){
        const container = el('topAlbums');
        container.innerHTML = '';
        if (!items.length) {
          container.innerHTML = '<div class="muted">No top albums available.</div>';
          return;
        }
        items.forEach((album, index) => {
          const cover = topAlbumCovers[index] || album.image?.[3]?.['#text'] || album.image?.[2]?.['#text'] || album.image?.[0]?.['#text'] || '';
          const card = document.createElement('div');
          card.className = 'top-album';
          card.innerHTML = `
              <img src="${escapeHtml(cover)}" alt="${escapeHtml(album.name)}">
          `;
          container.appendChild(card);
        });
      }

      function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[c]) }

      document.addEventListener('DOMContentLoaded', () => {
        loadMusic();
      });
    </script>
